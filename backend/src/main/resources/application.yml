spring:
  application:
    name: gomove-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  error:
    include-stacktrace: never
gomove:
  review:
    quality:
      minimum-ratings: 10
      recent-window: 10
      low-average-threshold: 3.0
  cash:
    commission-rate: 0.20
    commission-policy-version: CASH_MVP_V1
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-validity: 15m
    refresh-token-validity: 30d
    max-failed-login-attempts: 5
    lock-duration: 15m
  location:
    dispatch-freshness-seconds: 30
  dispatch:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 25
    radius-meters: 5000
    retry-seconds: 5
    search-timeout-seconds: 120
  routing:
    osrm:
      base-url: ${OSRM_BASE_URL:http://localhost:5000}
      connect-timeout: 2s
      read-timeout: 5s
  geocoding:
    # Photon public demo is for light academic use; replace this URL for larger traffic.
    base-url: ${GEOCODING_BASE_URL:https://photon.komoot.io}
    connect-timeout: 2s
    read-timeout: 4s
    # In-memory per authenticated account, shared by search and reverse lookup.
    max-requests: ${GEOCODING_MAX_REQUESTS:30}
    rate-window: ${GEOCODING_RATE_WINDOW:60s}
  pricing:
    engine-version: MVP_V1
    peak-hour:
      enabled: ${GOMOVE_PEAK_HOUR_PRICING_ENABLED:false}
      policy-version: PEAK_HOUR_V1
      timezone: Asia/Ho_Chi_Minh
      multiplier: "1.20"
      windows:
        - days: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
          start: "07:00"
          end: "09:00"
          reason: WEEKDAY_MORNING_PEAK
        - days: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
          start: "17:00"
          end: "19:00"
          reason: WEEKDAY_EVENING_PEAK
    weather:
      # Optional academic demonstration policy; disabled unless explicitly enabled.
      enabled: ${GOMOVE_WEATHER_PRICING_ENABLED:false}
      policy-version: WEATHER_V1
      provider: OPEN_METEO
      base-url: https://api.open-meteo.com
      connect-timeout: 2s
      read-timeout: 3s
      maximum-age: 30m
      expected-interval-seconds: 900
      no-rain-below-mm: 0.2
      heavy-rain-from-mm: 2.0
      rain-multiplier: 1.10
      heavy-rain-multiplier: 1.15
      maximum-combined-multiplier: 1.50
      cache-capacity: 256
      cache-grid-decimals: 2
      successful-cache-ttl: 2m
      failure-cache-ttl: 10s
    # Academic demonstration tariffs in VND; not commercial ride-hailing prices.
    tariffs:
      MOTORBIKE:
        base-fare: 12000.00
        price-per-km: 4500.00
        price-per-minute: 0.00
        surcharge: 0.00
        surge-multiplier: 1.00
      CAR_4_SEAT:
        base-fare: 25000.00
        price-per-km: 10000.00
        price-per-minute: 600.00
        surcharge: 0.00
        surge-multiplier: 1.00
      CAR_7_SEAT:
        base-fare: 35000.00
        price-per-km: 13000.00
        price-per-minute: 900.00
        surcharge: 0.00
        surge-multiplier: 1.00
