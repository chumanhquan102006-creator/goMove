# Per-build GitHub CI staging; controller18093, loopback18094; never reuse a project.
# Independent of legacy demo, Platform and Golden Path Compose files.
services:
  postgres:
    image: postgis/postgis@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
    restart: "no"
    labels:
      gomove.demo.transaction: ${DEMO_RELEASE_TOKEN:?Set durable deployment transaction token}
    environment:
      POSTGRES_DB: gomove_demo_ci
      POSTGRES_USER: gomove_demo_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap-db-password
    secrets:
      - source: ci_bootstrap_password
        target: bootstrap-db-password
      - source: ci_app_password
        target: app-db-password
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [private]
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=25"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    shm_size: 64m
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "gomove_demo_bootstrap", "-d", "gomove_demo_ci", "-t", "2"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
  osrm:
    image: ghcr.io/project-osrm/osrm-backend@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f
    restart: "no"
    labels:
      gomove.demo.transaction: ${DEMO_RELEASE_TOKEN:?Set durable deployment transaction token}
    command: ["osrm-routed", "--algorithm", "mld", "/data/hanoi.osrm"]
    volumes:
      - type: bind
        source: ${DEMO_OSRM_DATA_DIR:?Set reviewed Hanoi MLD directory}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/hanoi.osrm.properties && test -s /data/hanoi.osrm.cells && test -s /data/hanoi.osrm.partition && test -s /data/hanoi.osrm.mldgr && kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
  backend:
    image: ${DEMO_IMAGE:?Set verified image ID}
    restart: "no"
    labels:
      gomove.demo.transaction: ${DEMO_RELEASE_TOKEN:?Set durable deployment transaction token}
    environment:
      SPRING_PROFILES_ACTIVE: container
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_AUTOCONFIGURE_LOGGING: DEBUG
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gomove_demo_ci
      SPRING_DATASOURCE_USERNAME: gomove_demo_app
      OSRM_BASE_URL: http://osrm:5000
      GOMOVE_DISPATCH_ENABLED: "false"
      GOMOVE_DISPATCH_REPUTATION_TIE_BREAK_ENABLED: "true"
      GOMOVE_DISPATCH_NEAR_EQUAL_METERS: "50"
      GOMOVE_PEAK_HOUR_PRICING_ENABLED: "false"
      GOMOVE_WEATHER_PRICING_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError
      SPRING_APPLICATION_JSON: '{"gomove":{"realtime":{"allowed-origins":"http://localhost:18094,http://127.0.0.1:18094"}}}'
    secrets:
      - source: ci_app_password
        target: spring.datasource.password
      - source: ci_jwt
        target: JWT_SECRET
    ports: ["127.0.0.1:18094:8080"]
    networks: [private, ingress]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/health", "HealthProbe", "http://127.0.0.1:8080/actuator/health/readiness", '"status":"UP"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
networks:
  private:
    internal: true
  ingress:
    driver: bridge
volumes:
  postgres_data: {}
secrets:
  ci_bootstrap_password:
    file: ${DEMO_SECRET_DIR:?Set new build-specific secret directory}/bootstrap-db-password
  ci_app_password:
    file: ${DEMO_SECRET_DIR:?Set new build-specific secret directory}/app-db-password
  ci_jwt:
    file: ${DEMO_SECRET_DIR:?Set new build-specific secret directory}/JWT_SECRET
