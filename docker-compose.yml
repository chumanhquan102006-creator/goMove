services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: gomove-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gomove
      POSTGRES_USER: gomove
      POSTGRES_PASSWORD: gomove_dev_password
    ports:
      - "5432:5432"
    volumes:
      - gomove_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomove -d gomove"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gomove_postgres_data:
    name: gomove_postgres_data
