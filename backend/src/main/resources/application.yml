spring:
  application:
    name: gomove-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  error:
    include-stacktrace: never
gomove:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-validity: 15m
    refresh-token-validity: 30d
    max-failed-login-attempts: 5
    lock-duration: 15m
  location:
    dispatch-freshness-seconds: 30
