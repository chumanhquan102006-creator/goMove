spring:
  application:
    name: gomove-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  error:
    include-stacktrace: never
gomove:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-validity: 15m
    refresh-token-validity: 30d
    max-failed-login-attempts: 5
    lock-duration: 15m
  location:
    dispatch-freshness-seconds: 30
  routing:
    osrm:
      base-url: ${OSRM_BASE_URL:http://localhost:5000}
      connect-timeout: 2s
      read-timeout: 5s
  pricing:
    engine-version: MVP_V1
    # Academic demonstration tariffs in VND; not commercial ride-hailing prices.
    tariffs:
      MOTORBIKE:
        base-fare: 12000.00
        price-per-km: 4500.00
        price-per-minute: 0.00
        surcharge: 0.00
        surge-multiplier: 1.00
      CAR_4_SEAT:
        base-fare: 25000.00
        price-per-km: 10000.00
        price-per-minute: 600.00
        surcharge: 0.00
        surge-multiplier: 1.00
      CAR_7_SEAT:
        base-fare: 35000.00
        price-per-km: 13000.00
        price-per-minute: 900.00
        surcharge: 0.00
        surge-multiplier: 1.00
