name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Java 21, PostGIS Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check Docker availability
        run: docker info --format 'Docker server {{.ServerVersion}}'

      - name: Run all Backend tests
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-surefire-${{ github.run_id }}
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
          if-no-files-found: ignore
          retention-days: 7

  flutter-checks:
    name: Flutter analyze and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Get locked Flutter dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter source
        working-directory: mobile
        run: flutter analyze --no-pub

      - name: Run all Flutter tests
        working-directory: mobile
        run: flutter test --no-pub

  backend-image-build:
    name: Build Backend image (AMD64, no push)
    needs: backend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image locally on the runner
        run: docker build --progress=plain --platform linux/amd64 -f backend/Dockerfile -t gomove-backend:ci backend
