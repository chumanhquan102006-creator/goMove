name: gomove_mobile
description: "GoMove - Production-grade Ride-Hailing Platform for Students (Customer & Driver)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management (Strict Single Solution - Article 136)
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Service Locator & Dependency Injection
  get_it: ^7.7.0

  # Networking & HTTP Client
  dio: ^5.7.0

  # Real-time WebSocket / STOMP Protocol
  web_socket_channel: ^3.0.1
  stomp_dart_client: ^1.2.2

  # Secure Storage for JWT & Tokens (Article 139)
  flutter_secure_storage: ^9.2.2

  # JSON Serialization & Annotations
  json_annotation: ^4.9.0

  # Map, Geolocation & Tracking
  maplibre_gl: ^0.16.0
  geolocator: ^13.0.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/mock/
